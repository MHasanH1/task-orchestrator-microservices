name: Continuous Integration (CI)

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  code-quality:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run type-check

      - name: Run Next.js Linter
        run: npm run lint

  docker-build-verification:
    name: Docker Multi-Image Build with Layer Cache
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Image (with Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build Worker Image (with Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build Bull-Board Image (with Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.board
          push: false
          cache-from: type=gha,scope=board
          cache-to: type=gha,mode=max,scope=board